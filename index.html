<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1-13 轉盤（不重複抽）</title>

  <style>
    /* =========================
       插畫潮風 UI（類似參考圖）
       ========================= */
    :root{
      --ink:#0B1020;                /* 深墨 */
      --bg:#070A12;                 /* 黑底舞台 */
      --stroke:#0A0C12;             /* 粗描邊 */
      --paper:#ffffff;              /* 卡片底 */
      --pink:#ff4db3;

      --shadow-sticker: 0 18px 0 rgba(10,12,18,.22), 0 34px 60px rgba(0,0,0,.40);
      --shadow-soft: 0 14px 0 rgba(10,12,18,.18), 0 26px 42px rgba(0,0,0,.25);

      --wheel: 420px;
      --ring: 18px;
      --btn: 110px;

      --wheel-rot: 0deg;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(900px 520px at 18% 18%, rgba(255,60,160,.35) 0%, transparent 60%),
        radial-gradient(900px 520px at 82% 22%, rgba(0,190,255,.30) 0%, transparent 58%),
        radial-gradient(900px 620px at 50% 92%, rgba(0,255,160,.18) 0%, transparent 60%),
        radial-gradient(circle at 12px 12px, rgba(255,255,255,.08) 2px, transparent 2.2px) 0 0/28px 28px,
        var(--bg);
      display:grid;
      place-items:center;
      padding: 22px;
      color:#fff;
    }

    .page{
      width:min(1120px, 96vw);
      display:flex;
      gap: 22px;
      align-items: stretch;
      justify-content:center;
      flex-wrap:wrap;
    }

    .card{
      background: var(--paper);
      border: 4px solid rgba(10,12,18,.95);
      box-shadow: var(--shadow-sticker);
      border-radius: 24px;
      position:relative;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      inset: 10px;
      border-radius: 18px;
      box-shadow: inset 0 0 0 2px rgba(10,12,18,.10);
      pointer-events:none;
    }

    /* 左：轉盤 */
    .left{
      width:min(620px, 96vw);
      padding: 22px;
      display:grid;
      gap: 14px;
      justify-items:center;
    }

    .title{
      margin: 0;
      font-weight: 1000;
      letter-spacing: .8px;
      font-size: 18px;
      color: var(--ink);
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:center;
      text-align:center;
    }
    .badge{
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--pink);
      color: var(--ink);
      border: 3px solid rgba(10,12,18,.95);
      box-shadow: 0 10px 0 rgba(10,12,18,.18);
      font-weight: 1000;
    }

    .wheel-area{
      position:relative;
      width:min(var(--wheel), 86vw);
      height:min(var(--wheel), 86vw);
      display:grid;
      place-items:center;
    }

    /* 指針（往內） */
    .pointer{
      position:absolute;
      top: 8px;
      left:50%;
      transform: translateX(-50%);
      width:0;height:0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 26px solid var(--pink);
      z-index: 30;
      filter: drop-shadow(0 12px 0 rgba(10,12,18,.18)) drop-shadow(0 18px 20px rgba(0,0,0,.30));
    }
    .pointer::after{
      content:"";
      position:absolute;
      left:50%;
      top:-40px;
      transform: translateX(-50%);
      width:18px;height:18px;border-radius:999px;
      background:#fff;
      border: 5px solid rgba(10,12,18,.95);
      box-shadow: 0 12px 26px rgba(0,0,0,.12);
    }

    /* 轉盤 */
    .wheel{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, #fff 0 38%, transparent 39%),
        conic-gradient(from -90deg,
          #FFD84D 0 7.6923%,
          #00E1FF 7.6923% 15.3846%,
          #7C5CFF 15.3846% 23.0769%,
          #FF5DB1 23.0769% 30.7692%,
          #45FFB1 30.7692% 38.4615%,
          #FF6A4D 38.4615% 46.1538%,
          #00C2FF 46.1538% 53.8461%,
          #B9FF4D 53.8461% 61.5384%,
          #FFD84D 61.5384% 69.2307%,
          #7C5CFF 69.2307% 76.9230%,
          #FF5DB1 76.9230% 84.6153%,
          #45FFB1 84.6153% 92.3076%,
          #00E1FF 92.3076% 100%
        );
      border: var(--ring) solid rgba(10,12,18,.95);
      box-shadow: var(--shadow-soft);
      transform: rotate(var(--wheel-rot));
      transition: transform 3.8s cubic-bezier(.12,.72,.08,1);
      overflow:hidden;
    }
    .wheel::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      box-shadow:
        inset 0 0 0 10px rgba(255,255,255,.25),
        inset 0 0 0 2px rgba(0,0,0,.08),
        inset 0 0 50px rgba(0,0,0,.10);
      pointer-events:none;
    }

    .nums{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:10;
    }

    /* 數字：用 rotate(-wheel-rot) 保持正 */
    .num{
      position:absolute;
      width: 52px;
      height: 52px;
      display:grid;
      place-items:center;
      transform: translate(-50%, -50%) rotate(calc(-1 * var(--wheel-rot)));
      transform-origin: center;
      font-weight: 1000;
      font-size: 26px;
      color: var(--ink);
      text-shadow:
        0 2px 0 rgba(255,255,255,.75),
        0 6px 18px rgba(0,0,0,.12);
      user-select:none;
    }
    .num.used{ opacity:.18; filter: grayscale(100%); }

    /* 中間旋轉按鈕：貼紙感 */
    .spin-btn{
      position:absolute; left:50%; top:50%;
      transform: translate(-50%,-50%);
      width: var(--btn); height: var(--btn);
      border-radius: 999px;
      border: 10px solid rgba(10,12,18,.95);
      background: radial-gradient(circle at 30% 25%, #ffffff 0%, #ffe1f2 38%, #ffb7df 80%, #ff8fcc 100%);
      box-shadow: 0 14px 0 rgba(10,12,18,.18), 0 28px 50px rgba(0,0,0,.25);
      display:grid; place-items:center;
      font-weight: 1000;
      font-size: 18px;
      cursor:pointer;
      z-index: 40;
      transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
      color: var(--ink);
    }
    .spin-btn:active{
      transform: translate(-50%,-50%) translateY(2px) scale(.98);
      box-shadow: 0 10px 0 rgba(10,12,18,.18), 0 22px 40px rgba(0,0,0,.22);
    }
    .spin-btn[disabled]{ opacity:.60; cursor:not-allowed; }

    .result{
      width: min(520px, 92vw);
      background:#fff;
      border: 3px solid rgba(10,12,18,.95);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 12px 0 rgba(10,12,18,.16), 0 22px 34px rgba(0,0,0,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      font-weight: 1000;
      letter-spacing: .5px;
      text-align:center;
      flex-wrap:wrap;
      color: var(--ink);
    }
    .result b{ font-size: 30px; }

    .small{
      font-size: 12px;
      color: rgba(11,16,32,.75);
      font-weight: 1000;
    }

    .controls{ display:flex; justify-content:center; gap: 10px; flex-wrap:wrap; }
    .btn{
      padding: 10px 18px;
      border-radius: 14px;
      border: 3px solid rgba(10,12,18,.95);
      background: #fff;
      font-weight: 1000;
      cursor:pointer;
      box-shadow: 0 10px 0 rgba(10,12,18,.16), 0 18px 26px rgba(0,0,0,.14);
      color: var(--ink);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:active{
      transform: translateY(2px) scale(.99);
      box-shadow: 0 7px 0 rgba(10,12,18,.16), 0 14px 20px rgba(0,0,0,.12);
    }
    .btn.danger{ border-color: rgba(239,68,68,.92); }

    /* 右側：阿巴貓 */
    .right{
      width:min(380px, 96vw);
      padding: 18px;
      display:grid;
      gap: 12px;
      align-content:start;
      justify-items:center;
    }
    .side-title{
      margin:0;
      font-weight:1000;
      color: var(--ink);
      display:flex;
      align-items:center;
      gap:10px;
      letter-spacing:.8px;
    }
    .chip{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      background: var(--pink);
      color: var(--ink);
      border: 3px solid rgba(10,12,18,.95);
      box-shadow: 0 10px 0 rgba(10,12,18,.18);
      font-weight:1000;
    }
    .avatar-stage{
      width: 100%;
      min-height: 360px;
      border-radius: 24px;
      background:
        radial-gradient(520px 320px at 30% 22%, rgba(255,60,160,.30), transparent 60%),
        radial-gradient(520px 320px at 70% 35%, rgba(0,190,255,.28), transparent 58%),
        radial-gradient(circle at 10px 10px, rgba(255,255,255,.08) 2px, transparent 2.2px) 0 0/26px 26px,
        #0B0F1C;
      border: 3px solid rgba(10,12,18,.95);
      box-shadow: var(--shadow-soft);
      display:grid;
      place-items:center;
      padding: 20px;
    }
    .aba-cat{
      max-width: 92%;
      max-height: 320px;
      animation: float 3s ease-in-out infinite;
      filter:
        drop-shadow(0 14px 0 rgba(10,12,18,.18))
        drop-shadow(0 22px 26px rgba(0,0,0,.30));
      border-radius: 18px;
    }
    @keyframes float{
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @media (max-width: 520px){
      :root{ --wheel: 340px; --btn: 98px; }
      .num{ font-size: 22px; width: 46px; height: 46px; }
      .avatar-stage{ min-height: 300px; }
      .aba-cat{ max-height: 260px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card left">
      <p class="title">
        1～13 轉盤（不重複抽）
        <span class="badge">抽完 13 個會停用</span>
      </p>

      <div class="wheel-area">
        <div class="pointer" aria-hidden="true"></div>

        <div id="wheel" class="wheel" aria-label="1到13 轉盤">
          <div id="nums" class="nums" aria-hidden="true"></div>
        </div>

        <button id="spinBtn" class="spin-btn" type="button">旋轉</button>
      </div>

      <div class="result">
        結果：<b id="resultText">—</b>
        <span class="small" id="remainText">剩餘：13</span>
      </div>

      <div class="controls">
        <button id="resetBtn" class="btn danger" type="button">重置</button>
      </div>
    </div>

    <div class="card right">
      <p class="side-title">阿巴貓 <span class="chip">動圖</span></p>
      <div class="avatar-stage">
        <!-- 請把 aba-cat.gif 放在 repo 根目錄（和 index.html 同一層） -->
        <img src="aba-cat.gif" class="aba-cat" alt="北爛貓貓">
      </div>
    </div>
  </div>

  <script>
    /* =========================
       核心規則：1~13 不重複抽
       ========================= */
    const START = 1;
    const END = 13;
    const N = END - START + 1;
    const step = 360 / N;

    const wheel = document.getElementById('wheel');
    const nums = document.getElementById('nums');
    const spinBtn = document.getElementById('spinBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultText = document.getElementById('resultText');
    const remainText = document.getElementById('remainText');

    let pool = [];
    let currentDeg = 0;
    let spinning = false;

    function setWheelDeg(deg){
      currentDeg = deg;
      wheel.style.setProperty('--wheel-rot', `${currentDeg}deg`);
    }
    function norm360(deg){
      return ((deg % 360) + 360) % 360;
    }

    /* ✅ 數字不位移：用 sin/cos 算座標
       ✅ 手機更靠外：size 小時 pad 更小（r 更大） */
    function buildNumbers(){
      nums.innerHTML = "";
      const size = wheel.clientWidth;

      // pad 越小 -> r 越大 -> 越靠外
      const pad = (size < 380) ? 42 : 54;
      const r = (size / 2) - pad;

      for(let i=0;i<N;i++){
        const value = START + i;

        // conic-gradient from -90deg，格子中心角度
        const angDeg = -90 + (i + 0.5) * step;
        const angRad = angDeg * Math.PI / 180;

        const x = Math.cos(angRad) * r;
        const y = Math.sin(angRad) * r;

        const el = document.createElement('div');
        el.className = 'num';
        el.dataset.value = String(value);
        el.textContent = String(value);

        el.style.left = `calc(50% + ${x}px)`;
        el.style.top  = `calc(50% + ${y}px)`;

        nums.appendChild(el);
      }
    }

    function resetPool(){
      pool = [];
      for(let v=START; v<=END; v++) pool.push(v);

      remainText.textContent = `剩餘：${pool.length}`;
      resultText.textContent = "—";
      document.querySelectorAll('.num').forEach(el => el.classList.remove('used'));

      // 回正且不動畫抖一下
      wheel.style.transition = "none";
      setWheelDeg(0);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        wheel.style.transition = "transform 3.8s cubic-bezier(.12,.72,.08,1)";
      }));

      spinBtn.disabled = false;
      spinning = false;
    }

    function pickFromPool(){
      const idx = Math.floor(Math.random() * pool.length);
      const val = pool[idx];
      pool.splice(idx, 1);
      remainText.textContent = `剩餘：${pool.length}`;
      return val;
    }

    function markUsed(value){
      const el = document.querySelector(`.num[data-value="${value}"]`);
      if(el) el.classList.add('used');
    }

    function spin(){
      if(spinning) return;

      if(pool.length === 0){
        spinBtn.disabled = true;
        resultText.textContent = "已抽完";
        return;
      }

      spinning = true;
      spinBtn.disabled = true;
      resultText.textContent = "…";

      const picked = pickFromPool();
      const targetIndex = picked - START;

      // 多轉幾圈比較爽
      const extraTurns = (4 + Math.floor(Math.random() * 4)) * 360;

      // 指針在上方，停在該格中心
      const targetCenter = targetIndex * step + step / 2;
      const neededNorm = (360 - targetCenter) % 360;

      const curNorm = norm360(currentDeg);
      const deltaToNeeded = (neededNorm - curNorm + 360) % 360;

      setWheelDeg(currentDeg + extraTurns + deltaToNeeded);

      setTimeout(() => {
        resultText.textContent = String(picked);
        markUsed(picked);

        spinning = false;
        spinBtn.disabled = (pool.length === 0);
        if(pool.length === 0) remainText.textContent = "剩餘：0（已抽完）";
      }, 3900);
    }

    window.addEventListener('load', () => {
      buildNumbers();
      setWheelDeg(0);
      resetPool();
    });
    window.addEventListener('resize', buildNumbers);

    spinBtn.addEventListener('click', spin);
    resetBtn.addEventListener('click', resetPool);
  </script>
</body>
</html>
